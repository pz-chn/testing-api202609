version: '3.0'  # 使用 Docker Compose 的版本 3.0，適合大部分部署場景

services:
  api:  # 定義一個服務，名稱為 api
    image: kikurage3133/test_mygopen_api:${DOCKER_IMAGE_VERSION}  # 使用的映像檔名稱與標籤（版本）
    hostname: "api"  # 設定 hostname = api
    command: uv run uvicorn api.main:app --reload --host 0.0.0.0 --port 8888
    ports: 
      - 8889:8888

    restart: always  # 若容器停止或崩潰，自動重新啟動
    environment:
      - TZ=Asia/Taipei  # 設定時區為台北（UTC+8）
    env_file:
      - .env.docker  # 啟動時從本機讀入 MySQL 等連線設定
      - .env.line  # 啟動時從本機讀入 LINE 金鑰
    networks:
      - my_network  # 將此服務連接到 my_network 網路

networks:
  my_network:
    # 加入已經存在的網路
    external: true
